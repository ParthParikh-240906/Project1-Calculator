<!DOCTYPE html>
<html>
<head>
<title>CALCULATOR</title>
<style>
  .calc-wrapper {
    position: relative;
    width: 400px;
  }

  .calc-wrapper img {
    width: 100%;
    display: block;
  }

  #display {
    position: absolute;
    top: 5.2%;
    left: 7.5%;
    width: 84%;
    height: 11%;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    box-sizing: border-box;
  }

  .btn-grid {
    position: absolute;
    top: 21.6%;
    left: 7.5%;
    width: 84%;
    height: 63%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
  }

  .btn-grid button {
    background: transparent;   /* this is what makes them "invisible" */
    border: none;
    cursor: pointer;
  }

  .span-two {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calc-wrapper">
  <img src="image/calculator_mockup.png" alt="Calculator">

  <div id="display">0</div>

  <div class="btn-grid">
    <button data-action="clear">C</button>
    <button data-action="sqrt">&radic;</button>
    <button data-op="pow">^</button>
    <button data-op="div">/</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button data-op="mul">*</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button data-op="sub">-</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button data-op="add">+</button>

    <button class="span-two" data-num="0">0</button>
    <button data-num=".">.</button>
    <button data-action="equals">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');

  let num1 = null;
  let num2 = null;
  let operation = null;
  let typingSecond = false;

  function updateDisplay(value) {
    display.textContent = value;
  }

  document.querySelectorAll('.btn-grid button').forEach(btn => {
    btn.addEventListener('click', () => handleClick(btn));
  });

  function handleClick(btn) {
    const num = btn.dataset.num;
    const op = btn.dataset.op;
    const action = btn.dataset.action;

    if (num !== undefined) {
      handleNumber(num);
    } else if (op !== undefined) {
      handleOperator(op);
    } else if (action === 'clear') {
      handleClear();
    } else if (action === 'sqrt') {
      handleSqrt();
    } else if (action === 'equals') {
      handleEquals();
    }
  }

  function handleNumber(digit) {
    if (!typingSecond) {
      num1 = (num1 === null ? '' : num1) + digit;
      updateDisplay(num1);
    } else {
      num2 = (num2 === null ? '' : num2) + digit;
      updateDisplay(num2);
    }
  }

  function handleOperator(op) {
    if (num1 === null) return;  // no number typed yet
    operation = op;
    typingSecond = true;
  }

  function handleClear() {
    num1 = null;
    num2 = null;
    operation = null;
    typingSecond = false;
    updateDisplay('0');
  }

  function handleSqrt() {
    const target = typingSecond ? num2 : num1;
    if (target === null) return;
    callBackend('sqrt', target, null, (result) => {
      if (typingSecond) { num2 = result; } else { num1 = result; }
      updateDisplay(result);
    });
  }

  function handleEquals() {
    if (num1 === null || num2 === null || operation === null) return;
    callBackend(operation, num1, num2, (result) => {
      updateDisplay(result);
      num1 = String(result);
      num2 = null;
      operation = null;
      typingSecond = false;
    });
  }

  function callBackend(op, n1, n2, onSuccess) {
    fetch('http://127.0.0.1:5000/calculate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operation: op, num1: n1, num2: n2 })
    })
      .then(res => res.json())
      .then(data => {
        if (data.ERROR) {
          updateDisplay(data.ERROR);
        } else {
          onSuccess(data.result);
        }
      })
      .catch(() => updateDisplay('Error'));
  }
</script>

</body>
</html>
